title: FoLaJJ
subtitle: 随手记
description: FoLaJJ的个人笔记，记录网络安全、系统与编程、课程学习和旅途。
author: FoLaJJ
language: zh-CN
timezone: Asia/Shanghai
url: https://folajj.github.io
root: /

theme: butterfly
permalink: posts/:title/
pretty_urls:
  trailing_index: false
  trailing_html: true
new_post_name: :title.md
default_category: 编程与工程
per_page: 10
index_generator:
  path: ''
  per_page: 10
  order_by: -date

include:
  - .nojekyll
  - _media/**/*
  - _media2/**/*
skip_render:
  - _media/**/*
  - _media2/**/*
  - Agent_Interview/**/*
  - MyNavPage/**/*
  - SRK_Toolbox/**/*

markdown:
  disableNunjucks: true
  render:
    html: true
    breaks: false
    linkify: true
    typographer: false
  anchors:
    level: 1
    collisionSuffix: '—'
    permalink: false
  plugins:
    - name: markdown-it-task-lists

syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  wrap: true

search:
  path: local-search.xml
  field: all
  content: true
